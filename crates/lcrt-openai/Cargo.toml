[package]
name = "lcrt-openai"
version = "2.0.0"
description = "OpenAI realtime transcription, translation, and vocabulary adapters for LCRT"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
lcrt-core = { path = "../lcrt-core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
webpki-roots = "1"
