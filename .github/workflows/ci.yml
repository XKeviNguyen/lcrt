name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sherpa-spike:
    name: sherpa-spike
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/sherpa-streaming
    steps:
      - uses: actions/checkout@v4
      - name: Install repository Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch and verify pinned native archive
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/lcrt-sherpa-native"
          mkdir -p "$archive_dir"
          archive="$archive_dir/sherpa-onnx-v1.13.7-linux-x64-static-lib.tar.bz2"
          curl --fail --location --silent --show-error \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-v1.13.7-linux-x64-static-lib.tar.bz2 \
            --output "$archive"
          printf '%s  %s\n' \
            d1be7a69ac2b30120058d8302e624239a3064085383cfa47994a14fdc44c32d6 \
            "$archive" | sha256sum --check
          printf 'SHERPA_ONNX_ARCHIVE_DIR=%s\n' "$archive_dir" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps

  portable-core:
    name: portable-core (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-arm64
            target: aarch64-unknown-linux-gnu
          - name: windows-x64
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository Rust toolchain and target
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 "${{ matrix.target }}"

      - name: Compile-check portable core
        run: cargo check --locked -p lcrt-core --target "${{ matrix.target }}"

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [ -n "$base_sha" ] && ! printf '%s' "$base_sha" | grep -Eq '^0+$'; then
            git diff --check "$base_sha" "$HEAD_SHA"
          else
            git diff --check "$(git hash-object -t tree /dev/null)" "$HEAD_SHA"
          fi

      - name: Verify repository baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -f LICENSE
          test -f .gitignore

          grep -q "MIT License" LICENSE

      - name: Install Linux native development libraries
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            curl \
            desktop-file-utils \
            libadwaita-1-dev \
            libdbus-1-dev \
            libgtk-4-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            meson \
            ninja-build \
            wayland-protocols \
            pkg-config

      - name: Verify offline packaging integrity checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.hoangnguyen7474.Lcrt.desktop
          appstreamcli validate --no-net packaging/linux/io.github.hoangnguyen7474.Lcrt.metainfo.xml

      - name: Install pinned GTK4 layer-shell library
        run: scripts/install-gtk4-layer-shell.sh

      - name: Install repository Rust toolchain
        if: ${{ hashFiles('Cargo.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Check Rust formatting
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo test --locked --workspace --all-features

      - name: Build documentation without warnings
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps

      - name: Bootstrap status
        if: ${{ hashFiles('Cargo.toml') == '' }}
        run: echo "Rust workspace not created yet; repository baseline checks passed."
